<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<defs>
<marker id="arr6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f8f8f"/></marker>
</defs>
<rect width="1200" height="640" fill="#141414"/>
<text x="600" y="54" text-anchor="middle" font-size="30" fill="#e8e8e8" font-weight="600">The five-step pipeline</text>
<text x="600" y="82" text-anchor="middle" font-size="15" fill="#a8a8a8">deterministic everywhere except synthesis — the LLM translates, it doesn't judge</text>
<g font-size="13">
<rect x="20" y="130" width="200" height="330" rx="12" fill="#1c1c1c" stroke="#2e9e77" stroke-width="1.5"/>
<circle cx="52" cy="168" r="16" fill="#2e9e77"/><text x="52" y="174" text-anchor="middle" font-size="15" fill="#141414" font-weight="700">1</text>
<text x="80" y="174" font-size="15" fill="#e8e8e8" font-weight="600">DISCOVERY</text>
<text x="44" y="208" fill="#a8a8a8">sample documents,</text>
<text x="44" y="228" fill="#a8a8a8">infer schema + enums</text>
<line x1="44" y1="248" x2="196" y2="248" stroke="#2e2e2e"/>
<text x="44" y="276" font-size="12" fill="#8f8f8f">"this is actually quite</text>
<text x="44" y="294" font-size="12" fill="#8f8f8f">deterministic" — no LLM</text>
<text x="44" y="322" font-size="12" fill="#8f8f8f">needed for enum</text>
<text x="44" y="340" font-size="12" fill="#8f8f8f">inference</text>
<text x="44" y="380" font-size="11" fill="#2e9e77">DETERMINISTIC</text>

<rect x="252" y="130" width="200" height="330" rx="12" fill="#1c1c1c" stroke="#2e9e77" stroke-width="1.5"/>
<circle cx="284" cy="168" r="16" fill="#2e9e77"/><text x="284" y="174" text-anchor="middle" font-size="15" fill="#141414" font-weight="700">2</text>
<text x="312" y="174" font-size="15" fill="#e8e8e8" font-weight="600">RESOLUTION</text>
<text x="276" y="208" fill="#a8a8a8">string rules map</text>
<text x="276" y="228" fill="#a8a8a8">"me"/"alice" → logins</text>
<line x1="276" y1="248" x2="428" y2="248" stroke="#2e2e2e"/>
<text x="276" y="276" font-size="12" fill="#8f8f8f">"peter" → pwerry</text>
<text x="276" y="294" font-size="12" fill="#8f8f8f">LLM tiebreaker =</text>
<text x="276" y="312" font-size="12" fill="#8f8f8f">sledgehammer</text>
<text x="276" y="380" font-size="11" fill="#2e9e77">DETERMINISTIC</text>

<rect x="484" y="130" width="200" height="330" rx="12" fill="#1c1c1c" stroke="#d49036" stroke-width="2"/>
<circle cx="516" cy="168" r="16" fill="#d49036"/><text x="516" y="174" text-anchor="middle" font-size="15" fill="#141414" font-weight="700">3</text>
<text x="544" y="174" font-size="15" fill="#e8e8e8" font-weight="600">SYNTHESIS</text>
<text x="508" y="208" fill="#a8a8a8">schema + one tool,</text>
<text x="508" y="228" fill="#a8a8a8">forced QueryPlan</text>
<line x1="508" y1="248" x2="660" y2="248" stroke="#2e2e2e"/>
<text x="508" y="276" font-size="12" fill="#8f8f8f">tool_choice locks the</text>
<text x="508" y="294" font-size="12" fill="#8f8f8f">model to one call</text>
<text x="508" y="322" font-size="12" fill="#d49036">claude-haiku-4-5 —</text>
<text x="508" y="340" font-size="12" fill="#d49036">cheap, bounded</text>
<text x="508" y="380" font-size="11" fill="#d49036">LLM (CHEAP)</text>

<rect x="716" y="130" width="200" height="330" rx="12" fill="#1c1c1c" stroke="#2e9e77" stroke-width="1.5"/>
<circle cx="748" cy="168" r="16" fill="#2e9e77"/><text x="748" y="174" text-anchor="middle" font-size="15" fill="#141414" font-weight="700">4</text>
<text x="776" y="174" font-size="15" fill="#e8e8e8" font-weight="600">VALIDATION</text>
<text x="740" y="208" fill="#a8a8a8">allowlist gauntlet</text>
<text x="740" y="228" fill="#a8a8a8">before MongoDB</text>
<line x1="740" y1="248" x2="892" y2="248" stroke="#2e2e2e"/>
<text x="740" y="276" font-size="12" fill="#8f8f8f">reject $where/$regex;</text>
<text x="740" y="294" font-size="12" fill="#8f8f8f">tenant IDs injected</text>
<text x="740" y="312" font-size="12" fill="#8f8f8f">behind the scenes</text>
<text x="740" y="340" font-size="12" fill="#8f8f8f">errors[] → feeds retry</text>
<text x="740" y="380" font-size="11" fill="#2e9e77">DETERMINISTIC</text>

<rect x="948" y="130" width="200" height="330" rx="12" fill="#1c1c1c" stroke="#5b8dd9" stroke-width="1.5"/>
<circle cx="980" cy="168" r="16" fill="#5b8dd9"/><text x="980" y="174" text-anchor="middle" font-size="15" fill="#141414" font-weight="700">5</text>
<text x="1008" y="174" font-size="15" fill="#e8e8e8" font-weight="600">RETRY</text>
<text x="972" y="208" fill="#a8a8a8">error-driven</text>
<text x="972" y="228" fill="#a8a8a8">self-correction</text>
<line x1="972" y1="248" x2="1124" y2="248" stroke="#2e2e2e"/>
<text x="972" y="276" font-size="12" fill="#8f8f8f">loop errors back to</text>
<text x="972" y="294" font-size="12" fill="#8f8f8f">the LLM, bounded</text>
<text x="972" y="312" font-size="12" fill="#8f8f8f">retries — regex →</text>
<text x="972" y="330" font-size="12" fill="#8f8f8f">$match → full-text</text>
<text x="972" y="380" font-size="11" fill="#5b8dd9">LOOP</text>

<g stroke="#8f8f8f" stroke-width="2">
<line x1="224" y1="295" x2="248" y2="295" marker-end="url(#arr6)"/>
<line x1="456" y1="295" x2="480" y2="295" marker-end="url(#arr6)"/>
<line x1="688" y1="295" x2="712" y2="295" marker-end="url(#arr6)"/>
<line x1="920" y1="295" x2="944" y2="295" marker-end="url(#arr6)"/>
</g>
<path d="M 1048 460 C 1048 520, 600 520, 600 464" fill="none" stroke="#5b8dd9" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arr6)"/>
<text x="830" y="545" text-anchor="middle" font-size="12" fill="#8f8f8f">validation errors loop back — bad plans rejected, not run</text>
</g>
<text x="600" y="600" text-anchor="middle" font-size="13" fill="#8f8f8f">the model is the commodity — the deterministic scaffolding is the product</text>
</svg>
