<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<defs>
<marker id="arr3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f8f8f"/></marker>
<marker id="arr3g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e77"/></marker>
</defs>
<rect width="1200" height="640" fill="#141414"/>
<text x="600" y="54" text-anchor="middle" font-size="30" fill="#e8e8e8" font-weight="600">How shared cache hits work</text>
<text x="600" y="82" text-anchor="middle" font-size="15" fill="#a8a8a8">standardized agents → byte-identical prefixes → one always-warm cache</text>

<!-- LEFT: prefix stack -->
<rect x="40" y="120" width="360" height="400" rx="12" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="220" y="152" text-anchor="middle" font-size="13" fill="#d49036" letter-spacing="2">THE STABLE PREFIX</text>
<g font-size="14">
<rect x="64" y="170" width="312" height="64" rx="8" fill="#262626" stroke="#d49036"/>
<text x="220" y="196" text-anchor="middle" fill="#e8e8e8">system prompt</text>
<text x="220" y="216" text-anchor="middle" font-size="11" fill="#8f8f8f">identical for every run</text>
<rect x="64" y="242" width="312" height="64" rx="8" fill="#262626" stroke="#d49036"/>
<text x="220" y="268" text-anchor="middle" fill="#e8e8e8">tool definitions</text>
<text x="220" y="288" text-anchor="middle" font-size="11" fill="#8f8f8f">identical for every run</text>
<rect x="64" y="314" width="312" height="64" rx="8" fill="#262626" stroke="#d49036"/>
<text x="220" y="340" text-anchor="middle" fill="#e8e8e8">shared agent definition</text>
<text x="220" y="360" text-anchor="middle" font-size="11" fill="#8f8f8f">marketplace — byte-identical</text>
<rect x="64" y="386" width="312" height="64" rx="8" fill="#1c1c1c" stroke="#2e2e2e" stroke-dasharray="6,4"/>
<text x="220" y="412" text-anchor="middle" fill="#a8a8a8">your conversation</text>
<text x="220" y="432" text-anchor="middle" font-size="11" fill="#8f8f8f">the only part that differs</text>
</g>
<text x="220" y="486" text-anchor="middle" font-size="12" fill="#8f8f8f">providers cache KV tensors</text>
<text x="220" y="504" text-anchor="middle" font-size="12" fill="#8f8f8f">for identical prefixes</text>

<!-- MIDDLE: cache -->
<line x1="408" y1="320" x2="452" y2="320" stroke="#8f8f8f" stroke-width="2" marker-end="url(#arr3)"/>
<rect x="460" y="240" width="200" height="160" rx="12" fill="#1c1c1c" stroke="#2e9e77" stroke-width="1.5"/>
<text x="560" y="280" text-anchor="middle" font-size="15" fill="#e8e8e8" font-weight="600">inference-engine</text>
<text x="560" y="304" text-anchor="middle" font-size="15" fill="#e8e8e8" font-weight="600">cache</text>
<text x="560" y="332" text-anchor="middle" font-size="12" fill="#2e9e77">always warm</text>
<text x="560" y="352" text-anchor="middle" font-size="12" fill="#8f8f8f">cross-user sharing</text>

<!-- RIGHT: two users -->
<line x1="668" y1="320" x2="712" y2="320" stroke="#2e9e77" stroke-width="2" marker-end="url(#arr3g)"/>
<rect x="720" y="120" width="440" height="400" rx="12" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="940" y="152" text-anchor="middle" font-size="13" fill="#2e9e77" letter-spacing="2">TWO ENGINEERS, ONE CACHE</text>
<g font-size="14">
<rect x="744" y="170" width="392" height="56" rx="8" fill="#262626"/>
<text x="764" y="196" fill="#e8e8e8">Engineer A — same prefix</text>
<text x="764" y="216" font-size="12" fill="#2e9e77">✓ cache HIT</text>
<rect x="744" y="234" width="392" height="56" rx="8" fill="#262626"/>
<text x="764" y="260" fill="#e8e8e8">Engineer B — same prefix</text>
<text x="764" y="280" font-size="12" fill="#2e9e77">✓ cache HIT</text>
</g>
<line x1="744" y1="316" x2="1112" y2="316" stroke="#2e2e2e"/>
<text x="940" y="352" text-anchor="middle" font-size="26" fill="#e8e8e8" font-weight="600">96.22% hit rate</text>
<text x="940" y="382" text-anchor="middle" font-size="14" fill="#a8a8a8">measured on Copilot's preserved prefix</text>
<text x="940" y="420" text-anchor="middle" font-size="22" fill="#d49036" font-weight="600">$2.00 → $0.20 / 1M tokens</text>
<text x="940" y="446" text-anchor="middle" font-size="13" fill="#a8a8a8">~90% cheaper for cached prefixes</text>
<text x="940" y="486" text-anchor="middle" font-size="12" fill="#8f8f8f">per-team customization fragments the cache —</text>
<text x="940" y="504" text-anchor="middle" font-size="12" fill="#8f8f8f">treat agent definitions like CDN cache keys</text>
</svg>
