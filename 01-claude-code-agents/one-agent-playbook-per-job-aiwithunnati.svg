<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800">
  <rect width="1440" height="1800" fill="#f7f4ec"/>
  <text x="720" y="92" font-family="DejaVu Sans, sans-serif" font-size="72" font-weight="bold" fill="#1a1a2e" text-anchor="middle">STOP BUILDING AGENTS</text>
  <text x="720" y="152" font-family="DejaVu Sans, sans-serif" font-size="44" font-weight="bold" fill="#2e7d32" text-anchor="middle">One agent. A playbook per job.</text>
  <text x="720" y="198" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#666666" text-anchor="middle">The AI delegation layer - @aiwithunnati, Nov 2026</text>

  <!-- Comparison -->
  <rect x="40" y="230" width="660" height="280" rx="16" fill="#fde8e8" stroke="#c0392b" stroke-width="3"/>
  <text x="370" y="282" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="bold" fill="#c0392b" text-anchor="middle">THE OLD WAY</text>
  <text x="370" y="340" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="bold" fill="#1a1a2e" text-anchor="middle">15 half-finished agents</text>
  <rect x="90" y="372" width="180" height="46" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="180" y="403" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#1a1a2e" text-anchor="middle">email-agent</text>
  <rect x="285" y="372" width="200" height="46" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="385" y="403" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#1a1a2e" text-anchor="middle">research-agent</text>
  <rect x="500" y="372" width="150" height="46" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="575" y="403" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#1a1a2e" text-anchor="middle">+ 12 more</text>
  <text x="370" y="472" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#666666" text-anchor="middle">one agent per task - each breaks alone</text>

  <rect x="740" y="230" width="660" height="280" rx="16" fill="#e6f4ea" stroke="#2e7d32" stroke-width="3"/>
  <text x="1070" y="282" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="bold" fill="#2e7d32" text-anchor="middle">THE NEW WAY</text>
  <text x="1070" y="340" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="bold" fill="#1a1a2e" text-anchor="middle">1 agent, many playbooks</text>
  <rect x="790" y="372" width="200" height="46" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="890" y="403" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#1a1a2e" text-anchor="middle">weekly-report</text>
  <rect x="1005" y="372" width="180" height="46" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="1095" y="403" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#1a1a2e" text-anchor="middle">inbox-triage</text>
  <rect x="1200" y="372" width="150" height="46" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="1275" y="403" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#1a1a2e" text-anchor="middle">research</text>
  <text x="1070" y="472" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#666666" text-anchor="middle">the playbook changes per job - not the agent</text>

  <!-- Step 1 -->
  <rect x="40" y="540" width="1360" height="340" rx="16" fill="#ffffff" stroke="#e6a817" stroke-width="3"/>
  <circle cx="110" cy="610" r="38" fill="#e6a817"/>
  <text x="110" y="624" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="170" y="624" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="bold" fill="#1a1a2e">INTERVIEW - the model asks, you answer</text>
  <text x="80" y="692" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#e6a817">ASK ABOUT</text>
  <text x="80" y="728" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#1a1a2e">What triggers it, how often</text>
  <text x="80" y="760" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#1a1a2e">Inputs, and where they come from</text>
  <text x="80" y="792" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#1a1a2e">The steps, in the order you do them</text>
  <text x="80" y="824" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#1a1a2e">Decisions, and the rules behind them</text>
  <text x="80" y="856" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#1a1a2e">Good output vs bad output</text>
  <text x="760" y="692" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#e6a817">ASK ABOUT (CONT.)</text>
  <text x="760" y="728" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#1a1a2e">Tone, format, audience</text>
  <text x="760" y="760" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#1a1a2e">Past mistakes and edge cases</text>
  <text x="760" y="792" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#1a1a2e">What you check before it is done</text>
  <text x="760" y="824" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#1a1a2e">Ask follow-ups when an answer is vague</text>
  <text x="760" y="856" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#1a1a2e">Let the user add anything missed</text>

  <!-- Step 2 -->
  <rect x="40" y="910" width="1360" height="340" rx="16" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/>
  <circle cx="110" cy="980" r="38" fill="#2e7d32"/>
  <text x="110" y="994" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="170" y="994" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="bold" fill="#1a1a2e">TOOLBOX - files, scripts, templates</text>
  <text x="80" y="1062" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#2e7d32">ONE SKILL FOLDER PER JOB</text>
  <text x="80" y="1102" font-family="DejaVu Sans, monospace" font-size="26" fill="#1a1a2e">weekly-report/</text>
  <text x="80" y="1138" font-family="DejaVu Sans, monospace" font-size="26" fill="#1a1a2e">  SKILL.md</text>
  <text x="80" y="1174" font-family="DejaVu Sans, monospace" font-size="26" fill="#1a1a2e">  scripts/pull_metrics.py</text>
  <text x="80" y="1210" font-family="DejaVu Sans, monospace" font-size="26" fill="#1a1a2e">  templates/report_template.md</text>
  <text x="80" y="1246" font-family="DejaVu Sans, monospace" font-size="26" fill="#1a1a2e">  files/brand_guide.pdf</text>
  <text x="760" y="1062" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#2e7d32">SKILL.md SAYS WHICH TOOL FOR WHAT</text>
  <text x="760" y="1102" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#1a1a2e">Run pull_metrics.py for this week&#39;s numbers</text>
  <text x="760" y="1138" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#1a1a2e">Fill in report_template.md</text>
  <text x="760" y="1174" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#1a1a2e">Match the tone in brand_guide.pdf</text>
  <text x="760" y="1210" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#1a1a2e">The agent never guesses which file to use</text>

  <!-- Step 3 -->
  <rect x="40" y="1280" width="1360" height="290" rx="16" fill="#ffffff" stroke="#1565c0" stroke-width="3"/>
  <circle cx="110" cy="1350" r="38" fill="#1565c0"/>
  <text x="110" y="1364" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="170" y="1364" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="bold" fill="#1a1a2e">PROOF - definition of done, in the file</text>
  <text x="80" y="1432" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#1a1a2e">[ ] every number matches data/weekly.csv</text>
  <text x="80" y="1468" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#1a1a2e">[ ] uses the template&#39;s headings</text>
  <text x="80" y="1504" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#1a1a2e">[ ] under 300 words, in a client tone</text>
  <text x="80" y="1540" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#1a1a2e">[ ] no placeholder text left</text>
  <text x="760" y="1432" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#1a1a2e">The agent checks its own work</text>
  <text x="760" y="1468" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#1a1a2e">against this list before it</text>
  <text x="760" y="1504" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#1a1a2e">comes back to you.</text>

  <!-- Repair loop -->
  <rect x="40" y="1600" width="1360" height="100" rx="16" fill="#1a1a2e"/>
  <text x="720" y="1648" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">When it breaks, fix the playbook - not the agent.</text>
  <text x="720" y="1686" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#cccccc" text-anchor="middle">The system improves one text edit at a time.</text>

  <text x="720" y="1748" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#999999" text-anchor="middle">Original diagram distilled from @aiwithunnati&#39;s reel (Nov 2, 2026) - not the reel&#39;s artwork.</text>
</svg>
