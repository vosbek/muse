<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f0d26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="8" fill="url(#accent)"/>

  <text x="60" y="92" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="bold" fill="#ffffff">10 AI Interview Concepts</text>
  <text x="60" y="136" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#a5b4fc">the agent-engineering checklist, mapped to the playbook</text>
  <text x="60" y="172" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#64748b">distilled from @aiwithanju - each concept points to its playbook section</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <!-- 1 -->
    <rect x="60" y="205" width="960" height="96" rx="12" fill="#17153a" stroke="#2e2a6b"/>
    <circle cx="115" cy="253" r="26" fill="#8b5cf6"/><text x="115" y="262" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="160" y="246" font-size="23" font-weight="bold" fill="#ffffff">Harness Engineering</text>
    <text x="160" y="276" font-size="17" fill="#a5b4fc">the machine around the model: gather, tools, verifier</text>
    <text x="900" y="262" font-size="16" font-weight="bold" fill="#22d3ee" text-anchor="middle">01</text>

    <!-- 2 -->
    <rect x="60" y="313" width="960" height="96" rx="12" fill="#17153a" stroke="#2e2a6b"/>
    <circle cx="115" cy="361" r="26" fill="#8b5cf6"/><text x="115" y="370" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="160" y="354" font-size="23" font-weight="bold" fill="#ffffff">Loop Engineering</text>
    <text x="160" y="384" font-size="17" fill="#a5b4fc">feedback cycles with stopping rules: iterations, budget, no-progress</text>
    <text x="900" y="370" font-size="16" font-weight="bold" fill="#22d3ee" text-anchor="middle">01</text>

    <!-- 3 -->
    <rect x="60" y="421" width="960" height="96" rx="12" fill="#17153a" stroke="#2e2a6b"/>
    <circle cx="115" cy="469" r="26" fill="#8b5cf6"/><text x="115" y="478" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="160" y="462" font-size="23" font-weight="bold" fill="#ffffff">Context Engineering</text>
    <text x="160" y="492" font-size="17" fill="#a5b4fc">curate what stays in the window: select, compress, drop</text>
    <text x="900" y="478" font-size="16" font-weight="bold" fill="#22d3ee" text-anchor="middle">02</text>

    <!-- 4 -->
    <rect x="60" y="529" width="960" height="96" rx="12" fill="#17153a" stroke="#2e2a6b"/>
    <circle cx="115" cy="577" r="26" fill="#8b5cf6"/><text x="115" y="586" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="160" y="570" font-size="23" font-weight="bold" fill="#ffffff">Tool Design</text>
    <text x="160" y="600" font-size="17" fill="#a5b4fc">tools as the agent's API to the world: schema, permissions, cost</text>
    <text x="900" y="586" font-size="16" font-weight="bold" fill="#22d3ee" text-anchor="middle">01/02</text>

    <!-- 5 -->
    <rect x="60" y="637" width="960" height="96" rx="12" fill="#17153a" stroke="#2e2a6b"/>
    <circle cx="115" cy="685" r="26" fill="#8b5cf6"/><text x="115" y="694" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    <text x="160" y="678" font-size="23" font-weight="bold" fill="#ffffff">Memory Architecture</text>
    <text x="160" y="708" font-size="17" fill="#a5b4fc">short-term, long-term, knowledge base: match shape to data</text>
    <text x="900" y="694" font-size="16" font-weight="bold" fill="#22d3ee" text-anchor="middle">03</text>

    <!-- 6 -->
    <rect x="60" y="745" width="960" height="96" rx="12" fill="#17153a" stroke="#2e2a6b"/>
    <circle cx="115" cy="793" r="26" fill="#8b5cf6"/><text x="115" y="802" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
    <text x="160" y="786" font-size="23" font-weight="bold" fill="#ffffff">Orchestration Patterns</text>
    <text x="160" y="816" font-size="17" fill="#a5b4fc">coordinate multi-agent teams: decompose, assign, merge</text>
    <text x="900" y="802" font-size="16" font-weight="bold" fill="#22d3ee" text-anchor="middle">01</text>

    <!-- 7 -->
    <rect x="60" y="853" width="960" height="96" rx="12" fill="#17153a" stroke="#2e2a6b"/>
    <circle cx="115" cy="901" r="26" fill="#8b5cf6"/><text x="115" y="910" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
    <text x="160" y="894" font-size="23" font-weight="bold" fill="#ffffff">Guardrails and Permissions</text>
    <text x="160" y="924" font-size="17" fill="#a5b4fc">safety and access control: ALLOW, BLOCK, HUMAN REVIEW</text>
    <text x="900" y="910" font-size="16" font-weight="bold" fill="#22d3ee" text-anchor="middle">02</text>

    <!-- 8 -->
    <rect x="60" y="961" width="960" height="96" rx="12" fill="#17153a" stroke="#2e2a6b"/>
    <circle cx="115" cy="1009" r="26" fill="#8b5cf6"/><text x="115" y="1018" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
    <text x="160" y="1002" font-size="23" font-weight="bold" fill="#ffffff">Evals for Agents</text>
    <text x="160" y="1032" font-size="17" fill="#a5b4fc">grade outputs against criteria, hold out the test set</text>
    <text x="900" y="1018" font-size="16" font-weight="bold" fill="#22d3ee" text-anchor="middle">01/05</text>

    <!-- 9 -->
    <rect x="60" y="1069" width="960" height="96" rx="12" fill="#17153a" stroke="#2e2a6b"/>
    <circle cx="115" cy="1117" r="26" fill="#8b5cf6"/><text x="115" y="1126" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">9</text>
    <text x="160" y="1110" font-size="23" font-weight="bold" fill="#ffffff">Human-in-the-Loop Design</text>
    <text x="160" y="1140" font-size="17" fill="#a5b4fc">human judgment as a gate: review, correct, approve</text>
    <text x="900" y="1126" font-size="16" font-weight="bold" fill="#22d3ee" text-anchor="middle">01</text>

    <!-- 10 -->
    <rect x="60" y="1177" width="960" height="96" rx="12" fill="#17153a" stroke="#2e2a6b"/>
    <circle cx="115" cy="1225" r="26" fill="#8b5cf6"/><text x="115" y="1234" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle">10</text>
    <text x="160" y="1218" font-size="23" font-weight="bold" fill="#ffffff">Observability and Tracing</text>
    <text x="160" y="1248" font-size="17" fill="#a5b4fc">logs, token usage, traces: see what the system actually did</text>
    <text x="900" y="1234" font-size="16" font-weight="bold" fill="#22d3ee" text-anchor="middle">01</text>
  </g>

  <text x="60" y="1320" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#64748b">01 = Claude Code and Agents  |  02 = Jev Context Economics  |  03 = Agent Memory  |  05 = Prompts and Evals</text>
</svg>
