<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800">
  <rect width="1440" height="1800" fill="#0B0F14"/>
  <!-- header -->
  <text x="60" y="120" font-family="DejaVu Sans, sans-serif" font-size="62" font-weight="bold" fill="#FFFFFF">The Four Loops</text>
  <text x="60" y="176" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#8B949E">Stop prompting Claude. Design the loop that prompts it.</text>
  <text x="60" y="222" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#58A6FF">Anthropic's loop taxonomy - Claude Code team, June 2026</text>
  <line x1="60" y1="262" x2="1380" y2="262" stroke="#30363D" stroke-width="2"/>

  <!-- rung 1 -->
  <rect x="60" y="300" width="1320" height="240" rx="14" fill="#161B22" stroke="#30363D" stroke-width="2"/>
  <rect x="60" y="300" width="12" height="240" fill="#58A6FF"/>
  <text x="104" y="358" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" fill="#58A6FF">1  TURN-BASED</text>
  <text x="104" y="402" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">You hand off: the check</text>
  <text x="104" y="448" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#C9D1D9">Trigger: your prompt. Claude gathers context, acts, verifies, repeats.</text>
  <text x="104" y="486" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#C9D1D9">Stops: Claude judges it done, or needs you.</text>
  <text x="104" y="524" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#8B949E">Reach for: verification skills in SKILL.md</text>

  <!-- rung 2 -->
  <rect x="60" y="570" width="1320" height="240" rx="14" fill="#161B22" stroke="#30363D" stroke-width="2"/>
  <rect x="60" y="570" width="12" height="240" fill="#3FB950"/>
  <text x="104" y="628" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" fill="#3FB950">2  GOAL-BASED</text>
  <text x="104" y="672" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">You hand off: the stop condition</text>
  <text x="104" y="718" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#C9D1D9">Trigger: your prompt plus a finish line. An evaluator model checks each stop.</text>
  <text x="104" y="756" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#C9D1D9">Stops: goal met, or the turn cap you set.</text>
  <text x="104" y="794" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#8B949E">Reach for: /goal - e.g. Lighthouse 90 or above, stop after 5 tries</text>

  <!-- rung 3 -->
  <rect x="60" y="840" width="1320" height="240" rx="14" fill="#161B22" stroke="#30363D" stroke-width="2"/>
  <rect x="60" y="840" width="12" height="240" fill="#D29922"/>
  <text x="104" y="898" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" fill="#D29922">3  TIME-BASED</text>
  <text x="104" y="942" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">You hand off: the trigger</text>
  <text x="104" y="988" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#C9D1D9">Trigger: a clock you set. Same prompt, re-run on an interval.</text>
  <text x="104" y="1026" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#C9D1D9">Stops: you cancel it, or the work completes.</text>
  <text x="104" y="1064" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#8B949E">Reach for: /loop on your machine, /schedule in the cloud</text>

  <!-- rung 4 -->
  <rect x="60" y="1110" width="1320" height="240" rx="14" fill="#161B22" stroke="#30363D" stroke-width="2"/>
  <rect x="60" y="1110" width="12" height="240" fill="#BC8CFF"/>
  <text x="104" y="1168" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" fill="#BC8CFF">4  PROACTIVE</text>
  <text x="104" y="1212" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">You hand off: the prompt</text>
  <text x="104" y="1258" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#C9D1D9">Trigger: an event or schedule. No human in real time.</text>
  <text x="104" y="1296" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#C9D1D9">Stops: each item's goal met; the routine runs until you turn it off.</text>
  <text x="104" y="1334" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#8B949E">Reach for: all of the above, plus dynamic workflows and auto mode</text>

  <!-- start here panel -->
  <rect x="60" y="1380" width="1320" height="170" rx="14" fill="#161B22" stroke="#30363D" stroke-width="2"/>
  <text x="120" y="1438" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">START HERE</text>
  <text x="120" y="1486" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#C9D1D9">Pick one task you're tired of checking on. Give it a clear finish line</text>
  <text x="120" y="1524" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#C9D1D9">and a limit on how long to keep trying.</text>

  <!-- honest footer -->
  <text x="60" y="1620" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#D29922">KEEP IT HONEST</text>
  <text x="60" y="1662" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#8B949E">The reel names no commands and no Anthropic source. Definitions verified against</text>
  <text x="60" y="1696" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#8B949E">Anthropic's June 30, 2026 "Getting started with loops" guide.</text>
  <text x="60" y="1730" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#8B949E">The step-by-step setup is DM-gated: comment AUTOPILOT on the post.</text>
  <text x="60" y="1764" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#6E7681">Source: @itsmariahbrunner reel, Nov 8 2026 - Anthropic guide, June 30 2026</text>
</svg>
