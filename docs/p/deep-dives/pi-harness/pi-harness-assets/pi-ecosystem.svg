<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<rect width="1200" height="700" fill="#141414"/>
<text x="600" y="54" text-anchor="middle" font-size="30" fill="#e8e8e8" font-weight="600">The Pi ecosystem</text>
<text x="600" y="82" text-anchor="middle" font-size="15" fill="#a8a8a8">a minimal core designed to be built on — products, forks, and hybrids</text>

<g stroke="#2e2e2e" stroke-width="1.5">
<line x1="600" y1="290" x2="600" y2="170"/>
<line x1="600" y1="290" x2="868" y2="196"/>
<line x1="600" y1="290" x2="902" y2="370"/>
<line x1="600" y1="290" x2="748" y2="512"/>
<line x1="600" y1="290" x2="452" y2="512"/>
<line x1="600" y1="290" x2="298" y2="370"/>
<line x1="600" y1="290" x2="332" y2="196"/>
</g>

<!-- hub -->
<rect x="480" y="240" width="240" height="100" rx="14" fill="#1c1c1c" stroke="#d49036" stroke-width="2"/>
<text x="600" y="278" text-anchor="middle" font-size="20" fill="#e8e8e8" font-weight="600">PI CORE</text>
<text x="600" y="304" text-anchor="middle" font-size="13" fill="#a8a8a8">MIT · 114k★ · extensions + SDK</text>

<g font-size="15" fill="#e8e8e8">
<rect x="500" y="118" width="200" height="72" rx="10" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="600" y="146" text-anchor="middle" font-weight="600">OpenClaw</text>
<text x="600" y="168" text-anchor="middle" font-size="12" fill="#a8a8a8">145k★ — the breakout product</text>

<rect x="768" y="160" width="200" height="72" rx="10" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="868" y="188" text-anchor="middle" font-weight="600">oh-my-pi</text>
<text x="868" y="210" text-anchor="middle" font-size="12" fill="#a8a8a8">29k★ — batteries-included fork</text>

<rect x="802" y="334" width="200" height="72" rx="10" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="902" y="362" text-anchor="middle" font-weight="600">Bunny Agent</text>
<text x="902" y="384" text-anchor="middle" font-size="12" fill="#a8a8a8">"oh-my-zsh of coding agents"</text>

<rect x="648" y="476" width="200" height="72" rx="10" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="748" y="504" text-anchor="middle" font-weight="600">Fusion</text>
<text x="748" y="526" text-anchor="middle" font-size="12" fill="#a8a8a8">multi-node orchestrator</text>

<rect x="352" y="476" width="200" height="72" rx="10" fill="#1c1c1c" stroke="#2e9e77" stroke-width="1.5"/>
<text x="452" y="504" text-anchor="middle" font-weight="600">PiJ / PiJev</text>
<text x="452" y="526" text-anchor="middle" font-size="12" fill="#a8a8a8">Jev in the loop</text>

<rect x="198" y="334" width="200" height="72" rx="10" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="298" y="362" text-anchor="middle" font-weight="600">Forage</text>
<text x="298" y="384" text-anchor="middle" font-size="12" fill="#a8a8a8">small, inspectable systems</text>

<rect x="232" y="160" width="200" height="72" rx="10" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="332" y="188" text-anchor="middle" font-weight="600">Domi</text>
<text x="332" y="210" text-anchor="middle" font-size="12" fill="#a8a8a8">desktop agent, local-first</text>
</g>

<!-- timeline -->
<text x="600" y="606" text-anchor="middle" font-size="13" fill="#8f8f8f" letter-spacing="2">TIMELINE</text>
<g font-size="13">
<rect x="120" y="620" width="280" height="52" rx="10" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="260" y="642" text-anchor="middle" fill="#e8e8e8">Apr 2026 — Earendil acquires Pi</text>
<text x="260" y="660" text-anchor="middle" font-size="11" fill="#8f8f8f">Zechner becomes stakeholder</text>
<rect x="460" y="620" width="280" height="52" rx="10" fill="#1c1c1c" stroke="#d49036" stroke-width="1.5"/>
<text x="600" y="642" text-anchor="middle" fill="#e8e8e8">Oct 1, 2026 — Pi 1.0 + Codemode</text>
<text x="600" y="660" text-anchor="middle" font-size="11" fill="#8f8f8f">#1 on Hacker News · MCP reversal</text>
<rect x="800" y="620" width="280" height="52" rx="10" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="940" y="642" text-anchor="middle" fill="#e8e8e8">Pi Durable ships</text>
<text x="940" y="660" text-anchor="middle" font-size="11" fill="#8f8f8f">long-running agent substrate</text>
</g>
</svg>
