<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<rect width="1200" height="980" fill="#141414"/>
<text x="600" y="54" text-anchor="middle" font-size="30" fill="#e8e8e8" font-weight="600">Anatomy of a cloud agent</text>
<text x="600" y="82" text-anchor="middle" font-size="15" fill="#a8a8a8">eight planes — every production cloud agent decomposes into the same stack</text>
<g font-size="14">
<g>
<rect x="40" y="120" width="150" height="88" rx="10" fill="#262626"/><text x="115" y="156" text-anchor="middle" font-size="20" fill="#d49036" font-weight="700">1</text><text x="115" y="180" text-anchor="middle" font-size="11" fill="#a8a8a8">INVOCATION</text>
<rect x="204" y="120" width="660" height="88" rx="10" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="228" y="154" font-weight="600" fill="#e8e8e8">Slack · web · CLI · Chrome extension · cron · webhooks</text>
<text x="228" y="178" font-size="12" fill="#8f8f8f">the agent lives where work already happens — incl. non-engineers</text>
<text x="884" y="160" font-size="12" fill="#8f8f8f">meet builders</text><text x="884" y="178" font-size="12" fill="#8f8f8f">where they work</text>
</g>
<g>
<rect x="40" y="220" width="150" height="88" rx="10" fill="#262626"/><text x="115" y="256" text-anchor="middle" font-size="20" fill="#d49036" font-weight="700">2</text><text x="115" y="280" text-anchor="middle" font-size="11" fill="#a8a8a8">SESSION</text>
<rect x="204" y="220" width="660" height="88" rx="10" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="228" y="254" font-weight="600" fill="#e8e8e8">Queues · session locks · Durable Objects · session trees</text>
<text x="228" y="278" font-size="12" fill="#8f8f8f">many clients, one session, no conflicts — multiplayer-safe</text>
<text x="884" y="260" font-size="12" fill="#8f8f8f">input decoupled</text><text x="884" y="278" font-size="12" fill="#8f8f8f">from execution</text>
</g>
<g>
<rect x="40" y="320" width="150" height="88" rx="10" fill="#262626"/><text x="115" y="356" text-anchor="middle" font-size="20" fill="#d49036" font-weight="700">3</text><text x="115" y="380" text-anchor="middle" font-size="11" fill="#a8a8a8">ISOLATION</text>
<rect x="204" y="320" width="660" height="88" rx="10" fill="#1c1c1c" stroke="#d49036" stroke-width="1.5"/>
<text x="228" y="354" font-weight="600" fill="#e8e8e8">Modal sandboxes · EC2 devboxes · CF containers · Firecracker</text>
<text x="228" y="378" font-size="12" fill="#8f8f8f">one sandbox per session — snapshots make startup feel local</text>
<text x="884" y="360" font-size="12" fill="#8f8f8f">the blast-radius</text><text x="884" y="378" font-size="12" fill="#8f8f8f">plane</text>
</g>
<g>
<rect x="40" y="420" width="150" height="88" rx="10" fill="#262626"/><text x="115" y="456" text-anchor="middle" font-size="20" fill="#d49036" font-weight="700">4</text><text x="115" y="480" text-anchor="middle" font-size="11" fill="#a8a8a8">RUNTIME</text>
<rect x="204" y="420" width="660" height="88" rx="10" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="228" y="454" font-weight="600" fill="#e8e8e8">OpenCode · Goose fork · Pi (SDK/RPC) · codex exec-server</text>
<text x="228" y="478" font-size="12" fill="#8f8f8f">the model↔tools loop — interchangeable; everything around it is the product</text>
<text x="884" y="460" font-size="12" fill="#8f8f8f">the harness —</text><text x="884" y="478" font-size="12" fill="#8f8f8f">swappable</text>
</g>
<g>
<rect x="40" y="520" width="150" height="88" rx="10" fill="#262626"/><text x="115" y="556" text-anchor="middle" font-size="20" fill="#d49036" font-weight="700">5</text><text x="115" y="580" text-anchor="middle" font-size="11" fill="#a8a8a8">TOOLS</text>
<rect x="204" y="520" width="660" height="88" rx="10" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="228" y="554" font-weight="600" fill="#e8e8e8">MCP Toolshed · in-sandbox Postgres/Redis · deterministic pre-hydration</text>
<text x="228" y="578" font-size="12" fill="#8f8f8f">localhost latency to everything — context assembled by code, not hoped for</text>
<text x="884" y="560" font-size="12" fill="#8f8f8f">never limited by</text><text x="884" y="578" font-size="12" fill="#8f8f8f">missing context</text>
</g>
<g>
<rect x="40" y="620" width="150" height="88" rx="10" fill="#262626"/><text x="115" y="656" text-anchor="middle" font-size="20" fill="#d49036" font-weight="700">6</text><text x="115" y="680" text-anchor="middle" font-size="11" fill="#a8a8a8">VERIFY</text>
<rect x="204" y="620" width="660" height="88" rx="10" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="228" y="654" font-weight="600" fill="#e8e8e8">Real-browser screenshots · tests · LLM judges · CI</text>
<text x="228" y="678" font-size="12" fill="#8f8f8f">the agent tests against the real stack, not a mock</text>
<text x="884" y="660" font-size="12" fill="#8f8f8f">close the loop like</text><text x="884" y="678" font-size="12" fill="#8f8f8f">a human would</text>
</g>
<g>
<rect x="40" y="720" width="150" height="88" rx="10" fill="#262626"/><text x="115" y="756" text-anchor="middle" font-size="20" fill="#2e9e77" font-weight="700">7</text><text x="115" y="780" text-anchor="middle" font-size="11" fill="#a8a8a8">GATEWAY</text>
<rect x="204" y="720" width="660" height="88" rx="10" fill="#1c1c1c" stroke="#2e9e77" stroke-width="1.5"/>
<text x="228" y="754" font-weight="600" fill="#e8e8e8">Billing · model routing · policy · one observability pipe</text>
<text x="228" y="778" font-size="12" fill="#8f8f8f">hundreds of unattended sessions × token burn requires a single meter</text>
<text x="884" y="760" font-size="12" fill="#8f8f8f">the meter</text>
</g>
<g>
<rect x="40" y="820" width="150" height="88" rx="10" fill="#262626"/><text x="115" y="856" text-anchor="middle" font-size="20" fill="#2e9e77" font-weight="700">8</text><text x="115" y="880" text-anchor="middle" font-size="11" fill="#a8a8a8">OBSERVE</text>
<rect x="204" y="820" width="660" height="88" rx="10" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="228" y="854" font-weight="600" fill="#e8e8e8">OTLP traces · per-run AIC accounting · P90-overrun investigators</text>
<text x="228" y="878" font-size="12" fill="#8f8f8f">cost compared against outcomes, not vibes</text>
<text x="884" y="860" font-size="12" fill="#8f8f8f">every run</text><text x="884" y="878" font-size="12" fill="#8f8f8f">a line item</text>
</g>
</g>
<text x="600" y="950" text-anchor="middle" font-size="13" fill="#8f8f8f">own more planes, buy fewer — but know which plane you're standing on</text>
</svg>
