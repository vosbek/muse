<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<defs>
<marker id="arr5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f8f8f"/></marker>
</defs>
<rect width="1200" height="620" fill="#141414"/>
<text x="600" y="54" text-anchor="middle" font-size="30" fill="#e8e8e8" font-weight="600">A cloud agent request, end to end</text>
<text x="600" y="82" text-anchor="middle" font-size="15" fill="#a8a8a8">from Slack message to merged PR — Ramp Inspect's lifecycle</text>
<g font-size="12">
<rect x="15" y="170" width="118" height="150" rx="10" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="74" y="200" text-anchor="middle" font-size="14" fill="#e8e8e8" font-weight="600">PROMPT</text>
<text x="74" y="226" text-anchor="middle" fill="#a8a8a8">Slack · web ·</text>
<text x="74" y="244" text-anchor="middle" fill="#a8a8a8">Chrome · cron</text>
<rect x="161" y="170" width="118" height="150" rx="10" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="220" y="200" text-anchor="middle" font-size="14" fill="#e8e8e8" font-weight="600">QUEUE</text>
<text x="220" y="226" text-anchor="middle" fill="#a8a8a8">route to the</text>
<text x="220" y="244" text-anchor="middle" fill="#a8a8a8">right session</text>
<rect x="307" y="170" width="118" height="150" rx="10" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="366" y="200" text-anchor="middle" font-size="14" fill="#e8e8e8" font-weight="600">LOCK</text>
<text x="366" y="226" text-anchor="middle" fill="#a8a8a8">Dicts / DO —</text>
<text x="366" y="244" text-anchor="middle" fill="#a8a8a8">multiplayer-safe</text>
<rect x="453" y="170" width="118" height="150" rx="10" fill="#1c1c1c" stroke="#d49036" stroke-width="1.5"/>
<text x="512" y="200" text-anchor="middle" font-size="14" fill="#e8e8e8" font-weight="600">SNAPSHOT</text>
<text x="512" y="226" text-anchor="middle" fill="#a8a8a8">≤30-min fs —</text>
<text x="512" y="244" text-anchor="middle" fill="#a8a8a8">near-instant</text>
<rect x="599" y="170" width="118" height="150" rx="10" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="658" y="200" text-anchor="middle" font-size="14" fill="#e8e8e8" font-weight="600">HYDRATE</text>
<text x="658" y="226" text-anchor="middle" fill="#a8a8a8">deterministic</text>
<text x="658" y="244" text-anchor="middle" fill="#a8a8a8">MCP pre-run</text>
<rect x="745" y="170" width="118" height="150" rx="10" fill="#1c1c1c" stroke="#d49036" stroke-width="1.5"/>
<text x="804" y="200" text-anchor="middle" font-size="14" fill="#e8e8e8" font-weight="600">AGENT LOOP</text>
<text x="804" y="226" text-anchor="middle" fill="#a8a8a8">OpenCode in-</text>
<text x="804" y="244" text-anchor="middle" fill="#a8a8a8">sandbox</text>
<rect x="891" y="170" width="118" height="150" rx="10" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="950" y="200" text-anchor="middle" font-size="14" fill="#e8e8e8" font-weight="600">VERIFY</text>
<text x="950" y="226" text-anchor="middle" fill="#a8a8a8">screenshots ·</text>
<text x="950" y="244" text-anchor="middle" fill="#a8a8a8">tests · judge</text>
<rect x="1037" y="170" width="118" height="150" rx="10" fill="#1c1c1c" stroke="#2e9e77" stroke-width="1.5"/>
<text x="1096" y="200" text-anchor="middle" font-size="14" fill="#e8e8e8" font-weight="600">PR</text>
<text x="1096" y="226" text-anchor="middle" fill="#a8a8a8">user's token —</text>
<text x="1096" y="244" text-anchor="middle" fill="#a8a8a8">human review</text>
<g stroke="#8f8f8f" stroke-width="2">
<line x1="137" y1="245" x2="157" y2="245" marker-end="url(#arr5)"/>
<line x1="283" y1="245" x2="303" y2="245" marker-end="url(#arr5)"/>
<line x1="429" y1="245" x2="449" y2="245" marker-end="url(#arr5)"/>
<line x1="575" y1="245" x2="595" y2="245" marker-end="url(#arr5)"/>
<line x1="721" y1="245" x2="741" y2="245" marker-end="url(#arr5)"/>
<line x1="867" y1="245" x2="887" y2="245" marker-end="url(#arr5)"/>
<line x1="1013" y1="245" x2="1033" y2="245" marker-end="url(#arr5)"/>
</g>
</g>
<g font-size="12" fill="#8f8f8f">
<text x="220" y="360" text-anchor="middle">input decoupled</text>
<text x="220" y="378" text-anchor="middle">from execution</text>
<text x="512" y="360" text-anchor="middle">startup in</text>
<text x="512" y="378" text-anchor="middle">seconds</text>
<text x="804" y="360" text-anchor="middle">the token burn</text>
<text x="804" y="378" text-anchor="middle">happens here</text>
<text x="1096" y="360" text-anchor="middle">bot never</text>
<text x="1096" y="378" text-anchor="middle">self-approves</text>
</g>
<rect x="15" y="440" width="1140" height="120" rx="10" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="600" y="474" text-anchor="middle" font-size="14" fill="#e8e8e8" font-weight="600">The human's involvement: the prompt and the review. Everything between is infrastructure.</text>
<text x="600" y="502" text-anchor="middle" font-size="13" fill="#a8a8a8">wall clock is seconds-to-minutes; most of it is agent runtime —</text>
<text x="600" y="524" text-anchor="middle" font-size="13" fill="#a8a8a8">"kick off at night, check the PR in the morning"</text>
</svg>
