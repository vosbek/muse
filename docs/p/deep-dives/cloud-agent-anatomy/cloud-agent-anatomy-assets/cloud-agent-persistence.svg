<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<rect width="1200" height="640" fill="#141414"/>
<text x="600" y="54" text-anchor="middle" font-size="30" fill="#e8e8e8" font-weight="600">Sandbox persistence: three models</text>
<text x="600" y="82" text-anchor="middle" font-size="15" fill="#a8a8a8">the deepest sandbox design decision — what survives when it sleeps</text>
<g>
<rect x="40" y="120" width="340" height="430" rx="12" fill="#1c1c1c" stroke="#d49036" stroke-width="1.5"/>
<text x="210" y="156" text-anchor="middle" font-size="16" fill="#e8e8e8" font-weight="600">FILESYSTEM SNAPSHOTS</text>
<g font-size="13" fill="#a8a8a8">
<text x="64" y="196" fill="#d49036" font-weight="600">HOW</text>
<text x="64" y="218">stop() auto-snapshots fs as diffs;</text>
<text x="64" y="238">restore mounts as overlay</text>
<text x="64" y="272" fill="#d49036" font-weight="600">RESUME</text>
<text x="64" y="294">filesystem only — near-instant</text>
<text x="64" y="328" fill="#d49036" font-weight="600">COST</text>
<text x="64" y="350">cheap — diffs only</text>
<text x="64" y="384" fill="#d49036" font-weight="600">WHO</text>
<text x="64" y="406">Modal · Vercel · Cloudflare (beta)</text>
</g>
<line x1="64" y1="430" x2="356" y2="430" stroke="#2e2e2e"/>
<text x="64" y="458" font-size="12" fill="#8f8f8f">wins when: repo + deps dominate —</text>
<text x="64" y="478" font-size="12" fill="#8f8f8f">for coding agents, RAM is expendable</text>
<text x="64" y="512" font-size="12" fill="#2e9e77">★ the coding-agent default</text>
</g>
<g>
<rect x="430" y="120" width="340" height="430" rx="12" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="600" y="156" text-anchor="middle" font-size="16" fill="#e8e8e8" font-weight="600">RAM-PRESERVING PAUSE</text>
<g font-size="13" fill="#a8a8a8">
<text x="454" y="196" fill="#d49036" font-weight="600">HOW</text>
<text x="454" y="218">true suspend — RAM + process</text>
<text x="454" y="238">state frozen</text>
<text x="454" y="272" fill="#d49036" font-weight="600">RESUME</text>
<text x="454" y="294">everything — instant</text>
<text x="454" y="328" fill="#d49036" font-weight="600">COST</text>
<text x="454" y="350">expensive — RAM billed</text>
<text x="454" y="384" fill="#d49036" font-weight="600">WHO</text>
<text x="454" y="406">E2B · Daytona</text>
</g>
<line x1="454" y1="430" x2="746" y2="430" stroke="#2e2e2e"/>
<text x="454" y="458" font-size="12" fill="#8f8f8f">wins when: long processes, open</text>
<text x="454" y="478" font-size="12" fill="#8f8f8f">editors, debuggers must survive</text>
</g>
<g>
<rect x="820" y="120" width="340" height="430" rx="12" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="990" y="156" text-anchor="middle" font-size="16" fill="#e8e8e8" font-weight="600">FRESH + EXTERNALIZED</text>
<g font-size="13" fill="#a8a8a8">
<text x="844" y="196" fill="#d49036" font-weight="600">HOW</text>
<text x="844" y="218">sleep wipes the container;</text>
<text x="844" y="238">state lives in R2 / KV / D1</text>
<text x="844" y="272" fill="#d49036" font-weight="600">RESUME</text>
<text x="844" y="294">fresh container — rehydrate</text>
<text x="844" y="328" fill="#d49036" font-weight="600">COST</text>
<text x="844" y="350">cheapest — pay only when active</text>
<text x="844" y="384" fill="#d49036" font-weight="600">WHO</text>
<text x="844" y="406">Cloudflare default</text>
</g>
<line x1="844" y1="430" x2="1136" y2="430" stroke="#2e2e2e"/>
<text x="844" y="458" font-size="12" fill="#8f8f8f">wins when: many small agents —</text>
<text x="844" y="478" font-size="12" fill="#8f8f8f">hibernation is free</text>
</g>
</g>
<text x="600" y="600" text-anchor="middle" font-size="13" fill="#8f8f8f">Cloudflare's bet: fresh + externalized by default — with snapshots arriving for the coding-agent case</text>
</svg>
