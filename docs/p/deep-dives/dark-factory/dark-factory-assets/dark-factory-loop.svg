<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 460" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="1240" height="460" rx="16" fill="#141414"/>
  <text x="620" y="44" text-anchor="middle" fill="#f2f2f2" font-size="24" font-weight="bold">THE DARK FACTORY LOOP</text>
  <text x="620" y="70" text-anchor="middle" fill="#8a8a8a" font-size="14">human writes the spec · agents do everything else · trust is a score</text>

  <!-- SPEC node -->
  <rect x="30" y="120" width="180" height="200" rx="12" fill="#1e1e1e" stroke="#d49036" stroke-width="2"/>
  <text x="120" y="152" text-anchor="middle" fill="#d49036" font-size="16" font-weight="bold">HUMAN</text>
  <text x="120" y="182" text-anchor="middle" fill="#f2f2f2" font-size="30" font-weight="bold">SPEC</text>
  <text x="120" y="212" text-anchor="middle" fill="#8a8a8a" font-size="13">the one artifact</text>
  <text x="120" y="234" text-anchor="middle" fill="#8a8a8a" font-size="13">a person writes</text>
  <text x="120" y="292" text-anchor="middle" fill="#5c5c5c" font-size="12">+ guards the hidden</text>
  <text x="120" y="310" text-anchor="middle" fill="#5c5c5c" font-size="12">tests (see below)</text>

  <!-- arrow -->
  <line x1="210" y1="220" x2="268" y2="220" stroke="#5c5c5c" stroke-width="2" marker-end="url(#arr)"/>

  <!-- AGENT LOOP node -->
  <rect x="268" y="120" width="260" height="200" rx="12" fill="#1e1e1e" stroke="#5c5c5c" stroke-width="2"/>
  <text x="398" y="152" text-anchor="middle" fill="#f2f2f2" font-size="16" font-weight="bold">AGENT LOOP</text>
  <text x="398" y="186" text-anchor="middle" fill="#d49036" font-size="15">WRITE &#8594; RUN</text>
  <text x="398" y="212" text-anchor="middle" fill="#d49036" font-size="15">BREAK &#8594; FIX</text>
  <text x="398" y="244" text-anchor="middle" fill="#8a8a8a" font-size="13">loops until it ships</text>
  <text x="398" y="292" text-anchor="middle" fill="#5c5c5c" font-size="12">no human writes, no human</text>
  <text x="398" y="310" text-anchor="middle" fill="#5c5c5c" font-size="12">reads the code</text>

  <!-- arrow -->
  <line x1="528" y1="220" x2="586" y2="220" stroke="#5c5c5c" stroke-width="2" marker-end="url(#arr)"/>

  <!-- HOLDOUT node -->
  <rect x="586" y="120" width="220" height="200" rx="12" fill="#1e1e1e" stroke="#c0392b" stroke-width="2"/>
  <text x="696" y="152" text-anchor="middle" fill="#c0392b" font-size="16" font-weight="bold">HOLDOUT</text>
  <text x="696" y="182" text-anchor="middle" fill="#f2f2f2" font-size="14">real tests, kept</text>
  <text x="696" y="204" text-anchor="middle" fill="#f2f2f2" font-size="14">hidden &#128274;</text>
  <text x="696" y="236" text-anchor="middle" fill="#8a8a8a" font-size="13">outside the agent's</text>
  <text x="696" y="258" text-anchor="middle" fill="#8a8a8a" font-size="13">reach — never train</text>
  <text x="696" y="280" text-anchor="middle" fill="#8a8a8a" font-size="13">on the test</text>
  <text x="696" y="310" text-anchor="middle" fill="#5c5c5c" font-size="12">stops the agent</text>
  <text x="696" y="328" text-anchor="middle" fill="#5c5c5c" font-size="12">gaming its own tests</text>

  <!-- arrow -->
  <line x1="806" y1="220" x2="864" y2="220" stroke="#5c5c5c" stroke-width="2" marker-end="url(#arr)"/>

  <!-- CLONES node -->
  <rect x="864" y="120" width="170" height="200" rx="12" fill="#1e1e1e" stroke="#5c5c5c" stroke-width="2"/>
  <text x="949" y="152" text-anchor="middle" fill="#f2f2f2" font-size="16" font-weight="bold">CLONES</text>
  <text x="949" y="182" text-anchor="middle" fill="#d49036" font-size="14">slack.clone</text>
  <text x="949" y="204" text-anchor="middle" fill="#d49036" font-size="14">okta.clone</text>
  <text x="949" y="236" text-anchor="middle" fill="#8a8a8a" font-size="13">10,000+ scenarios</text>
  <text x="949" y="258" text-anchor="middle" fill="#8a8a8a" font-size="13">per hour</text>
  <text x="949" y="292" text-anchor="middle" fill="#5c5c5c" font-size="12">no rate limits,</text>
  <text x="949" y="310" text-anchor="middle" fill="#5c5c5c" font-size="12">no API bills</text>

  <!-- arrow -->
  <line x1="1034" y1="220" x2="1072" y2="220" stroke="#5c5c5c" stroke-width="2" marker-end="url(#arr)"/>

  <!-- SCORE node -->
  <rect x="1072" y="120" width="140" height="200" rx="12" fill="#1e1e1e" stroke="#2e9e77" stroke-width="2"/>
  <text x="1142" y="152" text-anchor="middle" fill="#2e9e77" font-size="16" font-weight="bold">SCORE</text>
  <text x="1142" y="196" text-anchor="middle" fill="#f2f2f2" font-size="36" font-weight="bold">87%</text>
  <text x="1142" y="226" text-anchor="middle" fill="#8a8a8a" font-size="13">not pass/fail —</text>
  <text x="1142" y="248" text-anchor="middle" fill="#8a8a8a" font-size="13">a dial, not a gate</text>

  <!-- bottom bar: who owns what -->
  <text x="120" y="372" text-anchor="middle" fill="#d49036" font-size="13" font-weight="bold">HUMAN OWNS</text>
  <text x="120" y="394" text-anchor="middle" fill="#8a8a8a" font-size="12">spec + hidden tests</text>
  <text x="398" y="372" text-anchor="middle" fill="#d49036" font-size="13" font-weight="bold">AGENT OWNS</text>
  <text x="398" y="394" text-anchor="middle" fill="#8a8a8a" font-size="12">the write/run/break/fix loop</text>
  <text x="696" y="372" text-anchor="middle" fill="#c0392b" font-size="13" font-weight="bold">NOBODY'S AGENT SEES</text>
  <text x="696" y="394" text-anchor="middle" fill="#8a8a8a" font-size="12">the grading suite</text>
  <text x="949" y="372" text-anchor="middle" fill="#d49036" font-size="13" font-weight="bold">INFRA OWNS</text>
  <text x="949" y="394" text-anchor="middle" fill="#8a8a8a" font-size="12">clones + scoring</text>
  <text x="1142" y="372" text-anchor="middle" fill="#2e9e77" font-size="13" font-weight="bold">OUTPUT</text>
  <text x="1142" y="394" text-anchor="middle" fill="#8a8a8a" font-size="12">ships in minutes</text>

  <text x="620" y="440" text-anchor="middle" fill="#5c5c5c" font-size="12">the engineer's job flips: you don't write code anymore — you build the factory that writes it</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5c5c5c"/>
    </marker>
  </defs>
</svg>
