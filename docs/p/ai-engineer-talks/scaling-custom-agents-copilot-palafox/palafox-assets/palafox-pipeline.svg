<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<defs>
<marker id="arr4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f8f8f"/></marker>
</defs>
<rect width="1200" height="620" fill="#141414"/>
<text x="600" y="54" text-anchor="middle" font-size="30" fill="#e8e8e8" font-weight="600">From your laptop to the pipeline</text>
<text x="600" y="82" text-anchor="middle" font-size="15" fill="#a8a8a8">the Palafox pattern — shared agents in, observable metered spend out</text>

<g font-size="15">
<!-- laptop -->
<rect x="40" y="140" width="220" height="230" rx="12" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="150" y="176" text-anchor="middle" font-weight="600" fill="#e8e8e8">LAPTOP</text>
<text x="150" y="210" text-anchor="middle" font-size="13" fill="#a8a8a8">dev + Copilot,</text>
<text x="150" y="232" text-anchor="middle" font-size="13" fill="#a8a8a8">custom agents</text>
<text x="150" y="254" text-anchor="middle" font-size="13" fill="#a8a8a8">&amp; skills</text>
<text x="150" y="300" text-anchor="middle" font-size="12" fill="#8f8f8f">where agents</text>
<text x="150" y="318" text-anchor="middle" font-size="12" fill="#8f8f8f">are authored</text>

<line x1="268" y1="255" x2="308" y2="255" stroke="#8f8f8f" stroke-width="2" marker-end="url(#arr4)"/>

<!-- marketplace -->
<rect x="316" y="140" width="220" height="230" rx="12" fill="#1c1c1c" stroke="#d49036" stroke-width="1.5"/>
<text x="426" y="176" text-anchor="middle" font-weight="600" fill="#e8e8e8">MARKETPLACE</text>
<text x="426" y="210" text-anchor="middle" font-size="13" fill="#a8a8a8">shared, versioned</text>
<text x="426" y="232" text-anchor="middle" font-size="13" fill="#a8a8a8">agent definitions</text>
<text x="426" y="278" text-anchor="middle" font-size="12" fill="#d49036">agents = CDN cache keys</text>
<text x="426" y="300" text-anchor="middle" font-size="12" fill="#8f8f8f">byte-identical prefixes</text>
<text x="426" y="318" text-anchor="middle" font-size="12" fill="#8f8f8f">→ shared cache hits</text>

<line x1="544" y1="255" x2="584" y2="255" stroke="#8f8f8f" stroke-width="2" marker-end="url(#arr4)"/>

<!-- pipeline -->
<rect x="592" y="140" width="300" height="230" rx="12" fill="#1c1c1c" stroke="#2e9e77" stroke-width="1.5"/>
<text x="742" y="176" text-anchor="middle" font-weight="600" fill="#e8e8e8">PIPELINE (gh-aw)</text>
<g font-size="13" fill="#e8e8e8">
<rect x="616" y="196" width="252" height="40" rx="8" fill="#262626"/><text x="742" y="221" text-anchor="middle">Research — read the repo</text>
<rect x="616" y="244" width="252" height="40" rx="8" fill="#262626"/><text x="742" y="269" text-anchor="middle">Plan — propose the change</text>
<rect x="616" y="292" width="252" height="40" rx="8" fill="#262626"/><text x="742" y="317" text-anchor="middle">Assign — run in sandbox</text>
</g>
<text x="742" y="356" text-anchor="middle" font-size="12" fill="#8f8f8f">every run metered</text>

<line x1="900" y1="255" x2="940" y2="255" stroke="#8f8f8f" stroke-width="2" marker-end="url(#arr4)"/>

<!-- PR -->
<rect x="948" y="140" width="212" height="230" rx="12" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="1054" y="176" text-anchor="middle" font-weight="600" fill="#e8e8e8">PULL REQUEST</text>
<text x="1054" y="210" text-anchor="middle" font-size="13" fill="#a8a8a8">human reviews,</text>
<text x="1054" y="232" text-anchor="middle" font-size="13" fill="#a8a8a8">merges, ships</text>
<text x="1054" y="278" text-anchor="middle" font-size="12" fill="#2e9e77">200-agent repo:</text>
<text x="1054" y="296" text-anchor="middle" font-size="12" fill="#2e9e77">578 issues, 8× faster</text>
<text x="1054" y="330" text-anchor="middle" font-size="12" fill="#8f8f8f">feedback → marketplace</text>
</g>

<!-- bottom strip -->
<rect x="40" y="420" width="548" height="140" rx="12" fill="#1c1c1c" stroke="#d49036" stroke-width="1.5"/>
<text x="314" y="452" text-anchor="middle" font-size="14" fill="#e8e8e8" font-weight="600">COST CONTROLS</text>
<text x="314" y="486" text-anchor="middle" font-size="22" fill="#d49036" font-weight="600">1 AIC = $0.01</text>
<text x="314" y="516" text-anchor="middle" font-size="13" fill="#a8a8a8">1,000 AIC / run · 5,000 AIC / day (defaults)</text>
<text x="314" y="540" text-anchor="middle" font-size="12" fill="#8f8f8f">P90 overruns get investigated, not ignored</text>

<rect x="612" y="420" width="548" height="140" rx="12" fill="#1c1c1c" stroke="#2e2e2e"/>
<text x="886" y="452" text-anchor="middle" font-size="14" fill="#e8e8e8" font-weight="600">gh-aw SECURITY MODEL</text>
<text x="886" y="486" text-anchor="middle" font-size="13" fill="#a8a8a8">six layers — sandboxing · credential</text>
<text x="886" y="510" text-anchor="middle" font-size="13" fill="#a8a8a8">isolation · output scanning ·</text>
<text x="886" y="534" text-anchor="middle" font-size="13" fill="#a8a8a8">declared writes only · audit logs</text>
</svg>
