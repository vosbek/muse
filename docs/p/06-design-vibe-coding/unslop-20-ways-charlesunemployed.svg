<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800">
  <rect width="1440" height="1800" fill="#0B0F14"/>
  <!-- header -->
  <text x="60" y="110" font-family="DejaVu Sans, sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF">20 Ways to Unslop AI Designs</text>
  <text x="60" y="158" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#8B949E">Charles Liu - the whole list in under 40 seconds</text>
  <line x1="60" y1="196" x2="1380" y2="196" stroke="#30363D" stroke-width="2"/>

  <!-- column 1: 1-10 -->
  <text x="60" y="250" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#F0883E">1</text>
  <text x="116" y="250" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">Delete filler badges</text>
  <text x="116" y="284" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#8B949E">that pill nobody reads</text>

  <text x="60" y="382" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#F0883E">2</text>
  <text x="116" y="382" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">Drop redundant labels</text>
  <text x="116" y="416" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#8B949E">say it once</text>

  <text x="60" y="514" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#F0883E">3</text>
  <text x="116" y="514" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">Unitalicize random words</text>
  <text x="116" y="548" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#8B949E">italics are not emphasis</text>

  <text x="60" y="646" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#F0883E">4</text>
  <text x="116" y="646" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">Mono only where needed</text>
  <text x="116" y="680" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#8B949E">code font, not body font</text>

  <text x="60" y="778" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#F0883E">5</text>
  <text x="116" y="778" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">Use a design system</text>
  <text x="116" y="812" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#8B949E">one set of tokens</text>

  <text x="60" y="910" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#F0883E">6</text>
  <text x="116" y="910" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">Show the actual product</text>
  <text x="116" y="944" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#8B949E">real UI, not a generic hero</text>

  <text x="60" y="1042" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#F0883E">7</text>
  <text x="116" y="1042" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">Enlarge the main feature</text>
  <text x="116" y="1076" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#8B949E">make the point big</text>

  <text x="60" y="1174" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#F0883E">8</text>
  <text x="116" y="1174" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">Group with spacing</text>
  <text x="116" y="1208" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#8B949E">proximity is the grouping</text>

  <text x="60" y="1306" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#F0883E">9</text>
  <text x="116" y="1306" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">Make headlines specific</text>
  <text x="116" y="1340" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#8B949E">a claim, not a category</text>

  <text x="60" y="1438" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#F0883E">10</text>
  <text x="116" y="1438" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">Emphasize the CTA</text>
  <text x="116" y="1472" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#8B949E">one action, unmissable</text>

  <!-- column 2: 11-20 -->
  <text x="760" y="250" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#F0883E">11</text>
  <text x="816" y="250" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">Add an accent colour</text>
  <text x="816" y="284" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#8B949E">one colour doing the work</text>

  <text x="760" y="382" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#F0883E">12</text>
  <text x="816" y="382" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">Keep icons consistent</text>
  <text x="816" y="416" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#8B949E">one style, one set</text>

  <text x="760" y="514" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#F0883E">13</text>
  <text x="816" y="514" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">Remove embellishments</text>
  <text x="816" y="548" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#8B949E">strip decoration</text>

  <text x="760" y="646" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#F0883E">14</text>
  <text x="816" y="646" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">Inner radius = outer - padding</text>
  <text x="816" y="680" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#8B949E">nested corners, done right</text>

  <text x="760" y="778" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#F0883E">15</text>
  <text x="816" y="778" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">Improve text contrast</text>
  <text x="816" y="812" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#8B949E">readable first</text>

  <text x="760" y="910" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#F0883E">16</text>
  <text x="816" y="910" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">Wrap headlines properly</text>
  <text x="816" y="944" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#8B949E">breaks where you choose</text>

  <text x="760" y="1042" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#F0883E">17</text>
  <text x="816" y="1042" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">Align by eye, not pixels</text>
  <text x="816" y="1076" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#8B949E">optical, not numerical</text>

  <text x="760" y="1174" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#F0883E">18</text>
  <text x="816" y="1174" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">Use tabular nums</text>
  <text x="816" y="1208" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#8B949E">numbers that line up</text>

  <text x="760" y="1306" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#F0883E">19</text>
  <text x="816" y="1306" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">Add loading states</text>
  <text x="816" y="1340" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#8B949E">never a dead screen</text>

  <text x="760" y="1438" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#F0883E">20</text>
  <text x="816" y="1438" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">Animate useful feedback</text>
  <text x="816" y="1472" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#8B949E">motion that means something</text>

  <!-- honest footer -->
  <text x="60" y="1580" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#D29922">KEEP IT HONEST</text>
  <text x="60" y="1622" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#8B949E">The "unslop skill" itself is DM-gated: comment UNSLOP on the post.</text>
  <text x="60" y="1656" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#8B949E">The reel never says what it is - a Claude skill, a checklist, a file.</text>
  <text x="60" y="1690" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#8B949E">Demos flash by in about 2 seconds each; the list above is the reel's own order.</text>
  <text x="60" y="1744" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#6E7681">Source: @charles.unemployed reel, Nov 7 2026</text>
</svg>
